services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true


    Nowo\SepaPaymentBundle\Converter\:
        resource: '../../Converter/*'

    Nowo\SepaPaymentBundle\Parser\:
        resource: '../../Parser/*'

    Nowo\SepaPaymentBundle\Generator\:
        resource: '../../Generator/*'

    # RemesaGenerator (deprecated) requires explicit args so TranslatorInterface is always second
    Nowo\SepaPaymentBundle\Generator\RemesaGenerator:
        arguments:
            $ibanValidator: '@nowo_sepa_payment.validator.iban_validator'
            $translator: '@translator'
            $xsdValidator: null
            $validateXsd: false

    Nowo\SepaPaymentBundle\Validator\:
        resource: '../../Validator/*'
        exclude: '../../Validator/Constraint/*'

    # Constraint Validators (must be explicitly configured)
    Nowo\SepaPaymentBundle\Validator\Constraint\:
        resource: '../../Validator/Constraint/*Validator.php'
        tags: ['validator.constraint_validator']

    Nowo\SepaPaymentBundle\Exporter\:
        resource: '../../Exporter/*'

    Nowo\SepaPaymentBundle\Logger\:
        resource: '../../Logger/*'

    Nowo\SepaPaymentBundle\Lookup\:
        resource: '../../Lookup/*'

    Nowo\SepaPaymentBundle\Cache\:
        resource: '../../Cache/*'

    Nowo\SepaPaymentBundle\Repository\:
        resource: '../../Repository/*'

    Nowo\SepaPaymentBundle\Service\:
        resource: '../../Service/*'

    # Services are automatically registered via #[AsAlias] attributes
    # All services are public and can be autowired or retrieved by their aliases

    # Console Commands
    # Commands still need explicit configuration for tags and arguments
    Nowo\SepaPaymentBundle\Command\ValidateIbanCommand:
        tags: ['console.command']
        arguments:
            $ibanValidator: '@nowo_sepa_payment.validator.iban_validator'

    Nowo\SepaPaymentBundle\Command\ConvertCccCommand:
        tags: ['console.command']
        arguments:
            $cccConverter: '@nowo_sepa_payment.converter.ccc_converter'

    Nowo\SepaPaymentBundle\Command\ValidateCreditCardCommand:
        tags: ['console.command']
        arguments:
            $creditCardValidator: '@nowo_sepa_payment.validator.credit_card_validator'

    Nowo\SepaPaymentBundle\Command\ParseDirectDebitCommand:
        tags: ['console.command']
        arguments:
            $parser: '@nowo_sepa_payment.parser.direct_debit_parser'
