# Dependabot configuration for SepaPaymentBundle
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Root Composer dependencies (bundle)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "php"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      phpstan:
        patterns:
          - "phpstan/*"
    commit-message:
      prefix: "chore(deps)"

  # Demo Composer dependencies
  - package-ecosystem: "composer"
    directory: "/demo/symfony8"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:25"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "demo"
      - "symfony8"
    commit-message:
      prefix: "chore(deps-demo)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    reviewers:
      - "HecFranco"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
