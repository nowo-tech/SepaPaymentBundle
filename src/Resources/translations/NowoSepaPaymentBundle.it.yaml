# Array key validation errors
validation.invalid_keys_top_level: "Chiave(i) non valida(e) al livello superiore: %keys%. Al livello superiore (informazioni di pagamento), è necessario utilizzare chiavi \"debtor*\" (es., debtorIban, debtorName, debtorBic) per rappresentare l'azienda che paga. Chiavi suggerite: %suggestions%. Nota: le chiavi \"creditor*\" devono essere utilizzate solo all'interno dell'array \"transactions\" (per i beneficiari che ricevono i pagamenti)."
validation.invalid_keys_transaction: "Chiave(i) non valida(e) nella transazione: %keys%. Nell'array delle transazioni, è necessario utilizzare chiavi \"creditor*\" (es., creditorIban, creditorName, creditorBic) per rappresentare il beneficiario che riceve il pagamento. Chiavi suggerite: %suggestions%. Nota: le chiavi \"debtor*\" devono essere utilizzate solo al livello superiore (per l'azienda che paga)."

