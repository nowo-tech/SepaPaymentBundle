validation.invalid_amount: "Invalid transaction amount: use either \"amount\" (decimal, in euros) or \"amountCents\" (integer, in cents), not both."
validation.invalid_currency_code: "Invalid currency \"%currency%\": expected a 3-letter uppercase ISO 4217 code."

# Date validation errors
validation.invalid_date_type: '%field% must be a string or DateTimeInterface'
validation.invalid_creation_date: 'creationDate must be a string or DateTimeInterface'
validation.invalid_execution_date: 'requestedExecutionDate must be a string or DateTimeInterface'

# Array key validation errors
validation.invalid_keys_top_level: 'Invalid key(s) at top level: %keys%. At the top level (payment information), you must use "debtor*" keys (e.g., debtorIban, debtorName, debtorBic) to represent the company that pays. Suggested keys: %suggestions%. Note: "creditor*" keys should only be used within the "transactions" array (for beneficiaries that receive payments).'
validation.invalid_keys_transaction: 'Invalid key(s) in transaction: %keys%. Within transactions array, you must use "creditor*" keys (e.g., creditorIban, creditorName, creditorBic) to represent the beneficiary that receives the payment. Suggested keys: %suggestions%. Note: "debtor*" keys should only be used at the top level (for the company that pays).'

# Business rules validation
validation.invalid_transaction_amount: 'Transaction amount %amount% exceeds maximum allowed amount of %max_amount% EUR'
validation.invalid_transaction_count: 'Transaction count %count% exceeds maximum allowed count of %max_count%'
validation.transaction_amount_out_of_range: "Invalid amount for transaction \"%end_to_end_id%\": %amount% EUR is outside the SEPA range of 0.01 to 999999999.99 EUR."
validation.invalid_execution_date_future: 'Execution date must be today or in the future'
validation.invalid_currency: 'Currency %currency% is not valid for SEPA. Only EUR is allowed.'
validation.invalid_sequence_type: 'Invalid sequence type: %type%. Must be one of: %valid_types%'
validation.invalid_mandate_expiration: 'Mandate expiration date must be in the future'

# Converter errors
validation.invalid_ccc_format: 'Invalid CCC format. Expected 20 digits.'

