services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sepa-payment-demo-symfony6-php
    working_dir: /app
    ports:
      - "${PORT:-8001}:80"
    volumes:
      - .:/app
      # Mount bundle root so the path repo works and bundle code changes are visible
      - ../..:/var/sepa-payment-bundle
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - SERVER_NAME=:80
    networks:
      - sepa-payment-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  sepa-payment-demo-network:
    driver: bridge
